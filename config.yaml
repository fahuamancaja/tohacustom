baseURL: https://fernandohuamancaja.com/
languageCode: en-us
title: "Fernando Huamancaja"
theme: "toha"

# Allow raw html in markdown file
markup:
  goldmark:
    renderer:
      unsafe: true
  tableOfContents:
    startLevel: 2
    endLevel: 6
    ordered: false

# Enable Google Analytics
googleAnalytics: UA-174164716-1

# Enable Disqus forum
disqusShortname: does-not-exist

# Enable global emoji support
enableEmoji: true

# Custom parameters
params:
  # copyright
  copyright: © 2026 Fernando Huamancaja.

  # background image of the landing page
  background: "images/background.jpeg"

  # GitHub repo URL of your site
  gitRepo: https://github.com/fahuamancaja/tohacustom

  # specify whether you want to write blog post or not
  enableBlogPost: false

  # specify whether you want to show Table of Contents in reading page
  enableTOC: false

  # specify the list of custom menus that you want to show in the top navbar.
  # they will be separated by a divider from the main menus.
  # customMenus:
  # - name: Notes
  #   url: https://hossainnotes.netlify.app/docs/example/

  # some information about you
  author:
    name: "Fernando Huamancaja"
    nickname: "Nando"
    image: "images/avatar.png"
    # give your some contact information. they will be used in the footer
    contactInfo:
      email: "fahuamancaja@gmail.com"
      phone: "+7044318072"
    # a summary of what you do
    # short static line shown under the greeting on the landing page
    tagline: "Cloud & AI integration engineer · Azure · .NET · Terraform · AI agents"
    # rotating lines on the landing page
    summary:
    - Manager, System Integrations at CapTech
    - I build Azure platforms with Terraform and Azure Pipelines
    - I orchestrate AI agents with Semantic Kernel on Azure AI Foundry
    - I ship .NET APIs and event-driven integrations
    # buttons shown on the landing page and in the footer
    links:
    - name: LinkedIn
      icon: "fab fa-linkedin"
      url: "https://www.linkedin.com/in/fernando-huamancaja/"
    - name: GitHub
      icon: "fab fa-github"
      url: "https://github.com/fahuamancaja"
    - name: Resume
      icon: "fas fa-file-alt"
      url: "files/FernandoHuamancajaResume.pdf"
