# Skill groups. Each skill uses either an "icon" (image under public/images/skills)
# or a "glyph" (name of a built-in line icon from src/components/Icon.astro).
- id: cloud
  order: 1
  name: Cloud & infrastructure
  skills:
    - name: Microsoft Azure
      icon: /images/skills/azure.svg
      summary: Compute, storage, messaging, identity and AI services across multiple environments.
      tags: [App Services, Functions, Key Vault, Entra ID]
    - name: Terraform
      icon: /images/skills/terraform.svg
      summary: Reusable modules for Azure landing zones and application infrastructure, promoted through dev, test and prod.
      tags: [Modules, Remote state, azurerm]
