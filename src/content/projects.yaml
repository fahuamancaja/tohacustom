# Featured entries render as case studies (problem / approach / outcome).
# Everything else renders in the "More projects" grid.
- id: ai-agent-platform
  order: 1
  featured: true
  name: AI agent orchestration platform
  role: Lead engineer · CapTech
  timeline: 2025 – present
  logo: /images/skills/azure-ai.svg
  summary: Multi-agent workflows on Azure AI Foundry, orchestrated with Semantic Kernel in Python and exposed as API endpoints.
  problem: Business processes needed language-model reasoning over internal documents and systems, with quality that could be proven, not assumed.
  approach: Semantic Kernel agents in Python with plugins for internal APIs, Service Bus for asynchronous hand-offs, Blob and Table storage for state, and indexers that keep retrieval grounded.
  outcome: Dedicated evaluator and scoring agents grade every agent and API response, so regressions surface before release instead of in front of users.
  tags: [Azure AI Foundry, Semantic Kernel, Python, Service Bus, Azure Storage]

- id: azure-iac
  order: 2
  featured: true
  name: Azure infrastructure as code
  role: Cloud engineer · CapTech
  timeline: 2025 – present
  logo: /images/skills/terraform.svg
  summary: Reusable Terraform modules and environment definitions for Azure, delivered through Azure DevOps pipelines.
  problem: Environments were being assembled by hand, which made them slow to reproduce and hard to review.
  approach: Terraform modules for networking, compute, storage, messaging and AI services, with remote state and per-environment variable sets.
  outcome: YAML pipelines plan and apply every change with approvals per environment, giving reviewable, repeatable infrastructure from dev to production.
  tags: [Terraform, Azure, Azure Pipelines, YAML]

- id: event-driven-integrations
  order: 3
  featured: true
  name: Event-driven system integrations
  role: Integration engineer · CapTech
  timeline: 2025 – present
  logo: /images/skills/azure-service-bus.svg
  summary: Service Bus queues and topics connecting line-of-business systems with resilient, idempotent .NET consumers.
  problem: Point-to-point calls between systems were brittle and failed loudly whenever a downstream service was slow or unavailable.
  approach: Decoupled producers and consumers with Service Bus, retries and dead-letter handling, and ingestion pipelines that index data for search and AI retrieval.
  outcome: Integrations absorb downstream outages, replay safely, and give operators a clear view of every message that needs attention.
  tags: [Azure Service Bus, Blob Storage, Table Storage, Azure AI Search]

