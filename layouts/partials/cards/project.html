<div
  class="col-sm-12 col-md-6 col-lg-4 p-2 filtr-item"
  data-category='all, {{ delimit (.filters | default .tags) ","}}'
>
  <div class="card mt-1 project-card">
    <div class="card">
      <div class="card-header">
        <div class="d-flex align-items-center">
          {{ if .logo }}
          <img class="card-img-xs" src="{{ .logo }}" alt="{{ .name }}" />
          {{ end }}
          <h5 class="card-title mb-0">{{ .name }}</h5>
        </div>
        <div class="sub-title">
          <span>{{ .role }}</span>
          <span>{{ .timeline }}</span>
        </div>
      </div>
      <div class="card-body text-justify pt-1 pb-1">
        <p>{{ .summary | markdownify }}</p>
        <div class="d-flex justify-content-between align-items-end project-footer">
          <div class="project-tags">
            {{ range .tags }}<span class="chip chip-sm">{{ . }}</span>{{ end }}
          </div>
          <span class="project-link">
            {{ if .repo }}
            <a
              class="github-button-inactive"
              href="{{ .repo }}"
              data-icon="octicon-standard"
              data-show-count="true"
              aria-label="Star {{ .name }}"
              >Star</a
            >
            {{ else if .url }}
            <a
              class="btn btn-outline-info btn-sm mb-2"
              href="{{ .url }}"
              target="_blank" rel="noopener"
              >Details</a
            >
            {{ end }}
          </span>
        </div>
      </div>
    </div>
  </div>
</div>
