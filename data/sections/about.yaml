# a summary about you (markdown is allowed)
summary: |
  I am a software engineer turned cloud and AI integration lead. At CapTech I design and ship
  solutions on **Microsoft Azure**: infrastructure defined in **Terraform** and delivered through
  **Azure Pipelines**, event-driven integrations built on **Service Bus** and **Azure Storage**, and
  AI workloads running on **Azure AI Foundry**.

  My current focus is agentic AI in .NET. I orchestrate multi-agent workflows with **Semantic Kernel**,
  expose them as API endpoints, and build scoring and evaluation agents so quality is measured, not assumed.

  Before consulting I spent several years in financial services at LPL Financial and Inspira Financial
  building .NET and Angular platforms, and I started my career in networking and IT support at Lowe's.

